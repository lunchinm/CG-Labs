<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>计算机图形学 - 实验作业</title>
    <style>
        *{ margin: 0; padding: 0; box-sizing: border-box; }

        body{
            font-family: "Microsoft YaHei", "SimHei", sans-serif;
            background: #1a1d24;
            color: #e0e0e0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .container{
            width: 100%;
            max-width: 640px;
            padding: 40px 24px;
        }

        h1{
            font-size: 28px;
            font-weight: 600;
            text-align: center;
            margin-bottom: 6px;
            color: #fff;
        }

        .subtitle{
            font-size: 14px;
            text-align: center;
            color: #888;
            margin-bottom: 36px;
        }

        .homework-list{
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .hw-card{
            display: flex;
            align-items: center;
            gap: 18px;
            padding: 18px 22px;
            background: #252a35;
            border: 1px solid #333a47;
            border-radius: 10px;
            text-decoration: none;
            color: #e0e0e0;
            transition: background 0.15s, border-color 0.15s, transform 0.1s;
        }
        .hw-card:hover{
            background: #2d3441;
            border-color: #4a5568;
            transform: translateX(4px);
        }
        .hw-card:active{ transform: translateX(2px); }

        /* 卡片左侧编号 */
        .hw-number{
            font-size: 24px;
            font-weight: 700;
            color: #4a90d9;
            min-width: 36px;
            text-align: center;
        }

        .hw-info{ flex: 1; }

        .hw-title{
            font-size: 16px;
            font-weight: 500;
            margin-bottom: 4px;
            color: #e0e0e0;
        }

        .hw-desc{
            font-size: 12px;
            color: #888;
            line-height: 1.5;
        }

        /* 未完成的作业（占位） */
        .hw-card.disabled{
            opacity: 0.4;
            cursor: default;
            pointer-events: none;
        }
        .hw-card.disabled .hw-number{ color: #555; }

        /* 箭头指示 */
        .hw-arrow{
            color: #4a90d9;
            font-size: 18px;
            font-family: monospace;
        }
        .hw-card.disabled .hw-arrow{ color: #444; }
    </style>
</head>

<body>
    <div class="container">
        <h1>计算机图形学</h1>
        <p class="subtitle">实验作业导航</p>

        <div class="homework-list">
            <!-- 作业 1 -->
            <a href="./实验/1/1/hw1.html" class="hw-card">
                <div class="hw-number">01</div>
                <div class="hw-info">
                    <div class="hw-title">交互式图形程序</div>
                    <div class="hw-desc">形状切换 / 缓动平移 / 旋转控制 / 多笔画手绘</div>
                </div>
                <div class="hw-arrow">&rarr;</div>
            </a>

            <!-- 后续作业在此添加，例如：
            <a href="./实验/2/2/hw2.html" class="hw-card">
                <div class="hw-number">02</div>
                <div class="hw-info">
                    <div class="hw-title">作业标题</div>
                    <div class="hw-desc">作业描述</div>
                </div>
                <div class="hw-arrow">&rarr;</div>
            </a>
            -->
        </div>
    </div>
</body>
</html>
