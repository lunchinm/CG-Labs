<!DOCTYPE html>
<html lang="zh-CN" data-theme="archive">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>HW1 · 交互式图形程序 · 形状切换与多笔画手绘</title>
  <link rel="icon" href="data:image/x-icon;base64,">
  <link rel="stylesheet" href="../../../ui-system/system.css?v=20261128a">
  <link rel="stylesheet" href="page.css?v=20261128a">
</head>
<body>
  <div class="ui-shell">
    <header class="ui-topbar">
      <div class="ui-brand">
        <span class="ui-brand__name">交互式图形</span>
        <span class="ui-brand__meta">HW1 · 形状切换 / 缓动平移 / 旋转 / 多笔画手绘</span>
      </div>
      <span class="ui-topbar__rule"></span>
      <div class="ui-hints" data-ui="hints"></div>
      <div class="ui-topbar__actions">
        <span class="ui-live"><span class="ui-live__dot"></span><span data-cell="mode">矩形</span></span>
        <button class="ui-icon-button" type="button" data-action="command" title="命令索引 Ctrl+K" aria-label="命令索引">K</button>
        <button class="ui-icon-button" type="button" data-action="help" title="快捷键 ?" aria-label="快捷键">?</button>
        <button class="ui-icon-button" type="button" data-action="rack" title="收起或展开参数面板 P" aria-label="收起或展开参数面板">P</button>
        <button class="ui-icon-button" type="button" data-action="focus" title="沉浸模式 F" aria-label="沉浸模式">F</button>
      </div>
    </header>

    <main class="ui-stage">
      <div class="ui-viewport" id="viewport">
        <canvas id="gl-canvas" aria-label="二维画布：形状切换、缓动平移、旋转与手绘"></canvas>

        <div class="pivot" id="pivotMarker" hidden aria-hidden="true"></div>
        <div class="pivot__hint" id="pivotHint" hidden aria-hidden="true">旋转中心</div>

        <div class="scene-fallback" id="scene-fallback" hidden>
          <p class="scene-fallback__title">无法启动 WEBGL 2.0</p>
          <p class="scene-fallback__text" id="fallback-text">当前浏览器没有可用的 WebGL2 上下文，画布无法绘制。</p>
        </div>
      </div>

      <span class="ui-corner" data-corner="tl"></span>
      <span class="ui-corner" data-corner="tr"></span>
      <span class="ui-corner" data-corner="bl"></span>
      <span class="ui-corner" data-corner="br"></span>

      <div class="ui-viewport__stamp"><strong>交互式图形程序</strong> · 形状切换与手绘</div>
      <div class="ui-viewport__meta"><span data-cell="scene-meta">画布 0 × 0 · 网格 = 无</span></div>

      <div class="ui-guide" data-ui="guide" hidden>
        <span class="ui-guide__row"><b>1 – 4</b>切换矩形 / 三角形 / 圆形 / 五角星</span>
        <span class="ui-guide__row"><b>点击画布</b>形状缓动移动到该处，颜色随机</span>
        <span class="ui-guide__row"><b>G / X</b>手绘形状 / 调整旋转中心</span>
        <button class="ui-guide__dismiss" type="button" data-guide="dismiss">知道了</button>
      </div>
    </main>

    <aside class="ui-rack" data-ui="rack">
      <div class="ui-rack__head">
        <span class="ui-rack__title">参数面板</span>
        <span class="ui-rack__meta">01—03</span>
        <button class="ui-icon-button" type="button" data-action="rack" title="收起参数面板 P" aria-label="收起参数面板">P</button>
      </div>
      <div data-ui="rack-body"></div>
    </aside>

    <nav class="ui-rail" data-ui="rail" aria-label="参数面板侧边栏">
      <span class="ui-rail__label">参数</span>
      <button type="button" data-rail="shape" title="01 图形">01</button>
      <button type="button" data-rail="rotate" title="02 旋转">02</button>
      <button type="button" data-rail="sketch" title="03 手绘">03</button>
      <button type="button" data-action="rack" title="展开参数面板">+</button>
    </nav>

    <footer class="ui-ledge" data-ui="ledger">
      <div class="ui-ledge__cell">
        <span class="ui-ledge__label">图形</span>
        <span class="ui-ledge__value" data-cell="shape">矩形</span>
      </div>
      <div class="ui-ledge__cell">
        <span class="ui-ledge__label">笔画</span>
        <span class="ui-ledge__value" data-cell="strokes">0</span>
      </div>
      <div class="ui-ledge__cell">
        <span class="ui-ledge__label">转速</span>
        <span class="ui-ledge__value" data-cell="speed">0 °/s</span>
      </div>
      <div class="ui-ledge__cell">
        <span class="ui-ledge__label">中心</span>
        <span class="ui-ledge__value" data-cell="pivot">(0, 0)</span>
      </div>
      <div class="ui-ledge__cell">
        <span class="ui-ledge__label">帧时</span>
        <span class="ui-ledge__value" data-cell="frame">—</span>
      </div>
    </footer>
  </div>

  <div class="ui-command" data-ui="command-index" hidden></div>
  <div class="ui-keys" data-ui="key-ledger" hidden></div>
  <div class="ui-echo" data-ui="echo" data-visible="false" role="status" aria-live="polite"></div>

  <script src="./Common/webgl-utils.js"></script>
  <script src="./Common/initShaders2.js"></script>
  <script src="./Common/MVnew.js"></script>
  <script src="../../../ui-system/system.js"></script>
  <script src="commands.js?v=20261123v"></script>
  <script src="hw1.js?v=20261128a"></script>
  <script src="ui.js?v=20261123v"></script>
</body>
</html>
